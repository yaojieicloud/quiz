<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>题库闯关 - 最新动态</title>
<link rel="stylesheet" href="css/common.css">
<script src="vendor/echarts.min.js"></script>
<style>
  .section-box { background:#fff; border-radius:18px; padding:20px; box-shadow:0 4px 14px rgba(0,0,0,0.08); margin-bottom:16px; }
  .section-box h3 { font-size:18px; color:#3a3a55; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
  .filter-bar { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:16px; }
  .filter-bar .form-group { margin:0; flex:1; min-width:140px; }
  .filter-bar select { padding:10px 14px; }
  .chart-box { width:100%; height:320px; }
  .ana-table { width:100%; border-collapse:collapse; font-size:14px; }
  .ana-table th { background:#f4f0fa; color:#7a6c8c; padding:10px 12px; text-align:left; }
  .ana-table td { padding:10px 12px; border-top:1px solid #f1f3f5; vertical-align:top; }
  .rate-badge { display:inline-block; min-width:52px; text-align:center; padding:3px 10px; border-radius:12px; font-weight:bold; font-size:13px; }
  .rate-good { background:#d3f9d8; color:#2b8a3e; }
  .rate-mid { background:#fff3bf; color:#e67700; }
  .rate-bad { background:#ffe3e3; color:#c92a2a; }
  .config-section { margin-bottom:4px; }
</style>
</head>
<body>

<div id="topbar"></div>

<header class="page-header">
  <div class="icon">🕒</div>
  <h1>最新动态</h1>
  <div class="subtitle">看看你最近都刷了哪些课！</div>
</header>

<main>
  <div class="section-box" style="padding-bottom:8px;">
    <div class="filter-bar">
      <div class="form-group" style="flex:1;max-width:150px;">
        <label>时间范围</label>
        <select class="form-select" id="rcDaysSelect" onchange="loadRecent()">
          <option value="1">今天</option>
          <option value="3">近3天</option>
          <option value="7" selected>近7天</option>
          <option value="14">近14天</option>
          <option value="30">近30天</option>
        </select>
      </div>
      <button class="btn btn-sm" onclick="loadRecent()">🔄 刷新</button>
    </div>
    <div class="config-section" style="margin-top:4px;">
      <div class="label" style="font-size:13px;color:#7a6c8c;margin-bottom:6px;">📚 科目（可多选，不选=全部）</div>
      <div class="chip-group" id="rcSubjChips"></div>
    </div>
  </div>

  <div class="section-box">
    <h3>📚 各课答题量（近期）</h3>
    <div id="chartRecentTopic" class="chart-box hbar-box"></div>
  </div>
  <div class="section-box">
    <h3>🕒 最近答题场次明细</h3>
    <div id="recentSessionsBox"></div>
  </div>
</main>

<script src="js/common.js"></script>
<script src="js/analytics-shared.js"></script>
<script>
const user = requireAuth();
if (!user) throw new Error('redirect');
document.getElementById('topbar').innerHTML = renderTopbar('stats');

async function loadRecent() {
  const subjIds = getSubjectChipValues('rcSubjChips');
  const days = document.getElementById('rcDaysSelect').value || '7';
  try {
    let qs = `?days=${days}`;
    if (subjIds.length) qs += `&subject_ids=${subjIds.join(',')}`;
    const d = await API.get('/api/exam/recent-activity' + qs);
    renderRecentTopicChart('chartRecentTopic', d);
    renderRecentSessions('recentSessionsBox', d);
  } catch (e) { toast(e.message, 'error'); }
}

async function init() {
  try {
    const subs = await API.get('/api/subjects');
    populateSubjectChips('rcSubjChips', subs, ['Python基础实操'], 'loadRecent');
  } catch (e) { /* ignore */ }
  loadRecent();
}

init();
</script>
</body>
</html>
