<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>题库闯关 - 学员掌握度</title>
<link rel="stylesheet" href="css/common.css">
<style>
  .toolbar { display:flex; align-items:center; gap:12px; margin:6px 0 16px; flex-wrap:wrap; }
  .toolbar select { padding:8px 12px; border-radius:10px; border:1px solid #ddd; font-size:14px; }
  .summary { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
  .kpi { background:#fff; border-radius:12px; padding:10px 16px; box-shadow:0 2px 8px rgba(123,92,196,.08); min-width:120px; }
  .kpi .v { font-size:22px; font-weight:bold; color:#7b5cc4; }
  .kpi .l { font-size:12px; color:#868e96; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; margin:4px 0 14px; font-size:12px; color:#868e96; }
  .legend span { display:inline-flex; align-items:center; gap:5px; }
  .dot { width:11px; height:11px; border-radius:50%; display:inline-block; }
  table { width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(123,92,196,.08); }
  th,td { padding:10px 12px; text-align:left; font-size:13px; border-bottom:1px solid #f1f0f4; }
  th { background:#faf8fd; color:#6b5b8a; font-weight:bold; }
  th.stu, td.stu { text-align:center; }
  .mcell { display:inline-block; min-width:74px; padding:6px 8px; border-radius:9px; font-size:12px; font-weight:bold; text-decoration:none; color:#fff; cursor:pointer; }
  .mcell small { display:block; font-weight:normal; opacity:.92; font-size:10px; margin-top:2px; }
  .c-passed { background:#37b24d; }
  .c-mastered { background:#f08c00; }
  .c-review { background:#e03131; }
  .c-practicing { background:#1c7ed6; }
  .c-not_started { background:#adb5bd; }
  .stu-name { font-weight:bold; color:#6b5b8a; }
</style>
</head>
<body>
<div id="topbar"></div>
<header class="page-header">
  <div class="icon">🎯</div>
  <h1>学员掌握度</h1>
  <div class="subtitle">按人查看每节课的掌握状态 —— 谁哪课通过 / 精通 / 需复习，一目了然</div>
</header>
<main>
  <div class="toolbar">
    <label>科目：</label>
    <select id="subjSel"></select>
    <label>难度档位：</label>
    <select id="tierSel">
      <option value="1">初级</option>
      <option value="2">进阶</option>
      <option value="3">挑战</option>
    </select>
  </div>
  <div class="summary" id="summary"></div>
  <div class="legend">
    <span><i class="dot c-passed"></i> 通过</span>
    <span><i class="dot c-mastered"></i> 精通</span>
    <span><i class="dot c-review"></i> 需复习</span>
    <span><i class="dot c-practicing"></i> 练习中</span>
    <span><i class="dot c-not_started"></i> 未开始</span>
    <span style="margin-left:auto;color:#adb5bd;">点任意格 → 查看该学员此课详情</span>
  </div>
  <table id="tbl">
    <thead id="thead"></thead>
    <tbody id="tbody"></tbody>
  </table>
</main>
<script src="js/common.js"></script>
<script src="js/admin-mastery.js"></script>
</body>
</html>
