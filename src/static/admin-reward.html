<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>奖励管理 · 题库闯关</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <style>
    .form-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 10px 0; }
    .form-row input { padding: 8px 10px; border: 1px solid #d9d2e6; border-radius: 10px; font-size: 14px; width: 150px; }
    .form-row label { font-size: 14px; color: #6b5b8a; }
    .admin-card { background:#fff; border-radius:16px; padding:16px 18px; margin:14px 0; box-shadow:0 3px 12px rgba(0,0,0,.06); }
    .cfg-table { width:100%; border-collapse:collapse; margin-top:8px; font-size:14px; }
    .cfg-table th,.cfg-table td { border:1px solid #efeaf6; padding:7px 10px; text-align:center; }
    .cfg-table th { background:#f6f2fc; color:#6b5b8a; }
    .hint { font-size:12px; color:#a89; margin-left:6px; }
    /* 配置编辑弹窗 */
    .cfg-modal-mask { position:fixed; inset:0; z-index:500; display:flex; align-items:center; justify-content:center; background:rgba(60,40,90,.45); }
    .cfg-modal { width:min(92vw,440px); max-height:86vh; overflow:auto; background:#fff; border-radius:18px; padding:20px 22px; box-shadow:0 20px 50px rgba(120,80,160,.35); }
    .cfg-modal h3 { margin:0 0 14px; color:#5b4b8a; }
    .cfg-modal .form-row { display:flex; align-items:center; gap:8px; margin:10px 0; }
    .cfg-modal .form-row label { width:140px; flex:none; font-size:14px; color:#6b5b8a; }
    .cfg-modal .form-row input, .cfg-modal .form-row select { flex:1; padding:8px 10px; border:1px solid #d9d2e6; border-radius:10px; font-size:14px; }
    .cfg-modal-actions { display:flex; gap:12px; justify-content:flex-end; margin-top:16px; }
    .btn-gray { background:#e9ecef; color:#495057; border:none; padding:10px 20px; border-radius:22px; cursor:pointer; font-size:14px; }
    /* ---- 待核销筛选 ---- */
    .pend-filter { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:8px 0 12px; }
    .pend-select { padding:8px 12px; border:1px solid #d9d2e6; border-radius:12px; font-size:14px; background:#fbfaff; color:#4a3d70; min-width:150px; }
    .pend-src-chips { display:flex; gap:6px; }
    .psc { font-size:13px; padding:6px 14px; border-radius:16px; background:#f1edf9; color:#6b5b8a; cursor:pointer; user-select:none; transition:all .15s; }
    .psc.active { background:linear-gradient(135deg,#a78bfa,#8b5cf6); color:#fff; font-weight:bold; box-shadow:0 2px 8px rgba(139,92,246,.35); }
    .pend-card { display:flex; justify-content:space-between; align-items:center; background:#fff; border-radius:14px; padding:12px 14px; margin-bottom:10px; box-shadow:0 3px 10px rgba(0,0,0,.06); border-left:4px solid #a78bfa; }
    .pend-card.src-direct { border-left-color:#ffa94d; }
    .pend-name { font-weight:bold; color:#3a3a55; font-size:14px; }
    .pend-meta { font-size:12px; color:#9a8fb5; margin-top:3px; }
    .pend-badge { display:inline-block; font-size:11px; font-weight:bold; padding:2px 8px; border-radius:8px; margin-right:6px; }
    .pend-badge.play { background:#f3edff; color:#7048e8; }
    .pend-badge.direct { background:#fff4e6; color:#e8590c; }
    /* ---- 积分调整学员卡片选择器（移动端友好） ---- */
    .stu-picker { display:flex; gap:10px; overflow-x:auto; padding:6px 2px 10px; -webkit-overflow-scrolling:touch; }
    .stu-card { flex:0 0 auto; min-width:118px; background:#fbfaff; border:2px solid #ece6f7; border-radius:14px; padding:10px 12px; cursor:pointer; text-align:center; transition:all .15s; user-select:none; }
    .stu-card:hover { border-color:#c4b5fd; }
    .stu-card.sel { background:linear-gradient(160deg,#f3edff,#ede4ff); border-color:#8b5cf6; box-shadow:0 3px 10px rgba(139,92,246,.3); }
    .stu-card .sc-name { font-weight:bold; color:#4a3d70; font-size:14px; white-space:nowrap; }
    .stu-card .sc-info { font-size:11px; color:#9a8fb5; margin-top:3px; white-space:nowrap; }
    .stu-card .sc-bal { font-size:13px; font-weight:bold; color:#e8590c; margin-top:3px; }
  </style>
</head>
<body>
  <div id="topbar"></div>
  <div class="redeem-wrap">
    <h2 class="section-title">🎁 奖励管理（管理员）</h2>

    <!-- 积分调整 -->
    <div class="admin-card">
      <h3>积分调整 <span class="hint">用于验收/补偿发分</span></h3>
      <div class="hint" style="margin:2px 0 8px;">选择学员（左右滑动查看更多）：</div>
      <div id="adjStudents" class="stu-picker"><p style="color:#888">加载中…</p></div>
      <div class="form-row">
        <label>增减值</label><input id="adjDelta" type="number" placeholder="正发放 负扣减">
        <label>原因</label><input id="adjReason" type="text" value="admin_adjust">
        <button class="btn btn-green" onclick="doAdjust()">提交</button>
      </div>
    </div>

    <!-- 待核销 -->
    <div class="admin-card">
      <h3>待核销实物 <button class="btn btn-sm btn-yellow" onclick="loadPending()">刷新</button></h3>
      <div class="pend-filter">
        <select id="pendStudent" class="pend-select" onchange="renderPending()">
          <option value="">全部学员</option>
        </select>
        <div class="pend-src-chips">
          <span class="psc active" data-src="" onclick="pickSrc(this)">全部</span>
          <span class="psc" data-src="play" onclick="pickSrc(this)">🎡 转盘</span>
          <span class="psc" data-src="direct" onclick="pickSrc(this)">🎁 直兑</span>
        </div>
      </div>
      <div id="pendingList"><p style="color:#888">加载中…</p></div>
    </div>

    <!-- 全局配置 -->
    <div class="admin-card">
      <h3>全局配置</h3>
      <div class="form-row">
        <label>抽奖费 wheel_cost</label>
        <input id="cfgCost" type="number">
        <button class="btn btn-green" onclick="saveCfg()">保存</button>
        <span class="hint">上线弹窗版本：<span id="cfgVer">-</span></span>
      </div>
    </div>

    <!-- 精通奖励测试 -->
    <div class="admin-card">
      <h3>精通奖励测试 <span class="hint">模拟达成精通，预览烟花惊喜弹窗效果（不发真实积分）</span></h3>
      <div class="form-row">
        <button class="btn btn-yellow" onclick="testMasteryReward()">🎉 模拟达成精通（预览弹窗）</button>
      </div>
    </div>

    <!-- 配置编辑 -->
    <div class="admin-card">
      <h3>积分矩阵 <span class="hint">答对得分档位 → 发放积分（可新增/编辑/删除）</span></h3>
      <div id="rulesTbl"></div>
    </div>
    <div class="admin-card">
      <h3>转盘奖品池 <span class="hint">权重越大越容易抽中（可改权重/增删）</span></h3>
      <div id="prizesTbl"></div>
    </div>
    <div class="admin-card">
      <h3>直兑商城 <span class="hint">「兑换积分」即实物兑换所需积分，可改</span></h3>
      <div id="itemsTbl"></div>
    </div>
  </div>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/admin-reward.js"></script>
</body>
</html>
