<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>题库闯关 - 答题记录</title>
<link rel="stylesheet" href="css/common.css">
</head>
<body>

<div id="topbar"></div>

<header class="page-header">
  <div class="icon">📋</div>
  <h1>答题记录</h1>
  <div class="subtitle">每一次闯关都算数，看看你的进步！</div>
</header>

<main>
  <div id="filterBox" style="max-width:820px;margin:0 auto 12px;padding:0 16px;"></div>
  <div id="listBox"></div>
</main>

<script src="js/common.js"></script>
<script>
const user = requireAuth();
if (!user) throw new Error('redirect');
document.getElementById('topbar').innerHTML = renderTopbar('records');

let allRecords = [];
let allSubjects = [];
let selectedSubjects = new Set(); // 空集合 = 全部
let expandedRecordId = null; // 当前展开的记录ID（同时只展开一条抽屉）

async function loadSubjects() {
  try {
    allSubjects = await API.get('/api/subjects');
  } catch(e) { allSubjects = []; }
  renderFilter();
}

function renderFilter() {
  if (!allSubjects.length) { document.getElementById('filterBox').innerHTML = ''; return; }
  // 年级行：点击年级 = 一键勾选/取消该年级下全部科目
  const grades = [...new Set(allSubjects.map(s => s.grade).filter(Boolean))];
  const gradeChips = grades.map(g => {
    const subs = allSubjects.filter(s => s.grade === g);
    const allOn = subs.length && subs.every(s => selectedSubjects.has(s.id));
    return `<span class="chip ${allOn ? 'active' : ''}" style="font-weight:bold;" onclick="toggleGrade('${esc(g)}')">🎓 ${esc(g)}</span>`;
  }).join('');
  // 科目行（标注所属年级）
  const chips = allSubjects.map(s => {
    const active = selectedSubjects.has(s.id) ? 'active' : '';
    const tag = s.grade ? ` <span style="opacity:.6;font-size:11px;">${esc(s.grade)}</span>` : '';
    return `<span class="chip ${active}" data-sid="${s.id}" onclick="toggleSubject(${s.id})">${esc(s.icon||'📚')} ${esc(s.name)}${tag}</span>`;
  }).join('');
  const clearBtn = selectedSubjects.size ? '<span class="chip" style="border-style:dashed;" onclick="clearSubjects()">✕ 清除筛选</span>' : '';
  document.getElementById('filterBox').innerHTML =
    (grades.length ? `<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px;">
    <span style="font-size:13px;color:#9c8bb5;margin-right:4px;">🎓 按年级选：</span>${gradeChips}</div>` : '') +
    `<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
    <span style="font-size:13px;color:#9c8bb5;margin-right:4px;">📚 筛选科目（可多选，不选=全部）：</span>${chips}${clearBtn}</div>`;
}

function toggleGrade(g) {
  const subs = allSubjects.filter(s => s.grade === g);
  const allOn = subs.length && subs.every(s => selectedSubjects.has(s.id));
  subs.forEach(s => { if (allOn) selectedSubjects.delete(s.id); else selectedSubjects.add(s.id); });
  expandedRecordId = null;
  renderFilter();
  renderList();
}

function toggleSubject(sid) {
  if (selectedSubjects.has(sid)) selectedSubjects.delete(sid);
  else selectedSubjects.add(sid);
  // 筛选变化时清理已展开的记录（防止筛选后旧记录不在列表中却仍保持展开状态）
  expandedRecordId = null;
  renderFilter();
  renderList();
}

function clearSubjects() {
  selectedSubjects.clear();
  expandedRecordId = null;
  renderFilter();
  renderList();
}

function renderList() {
  const box = document.getElementById('listBox');
  let records = allRecords;
  if (selectedSubjects.size) {
    records = records.filter(r => selectedSubjects.has(r.subject_id));
  }
  if (!records.length) {
    box.innerHTML = '<div class="empty"><div class="icon">📭</div><p>没有符合条件的答题记录</p></div>';
    return;
  }
  box.innerHTML = records.map(r => {
    const rank = scoreRank(r.score);
    const isOpen = expandedRecordId === r.id;
    const btnTxt = isOpen ? '收起' : '查看讲解';
    const btnCls = isOpen ? 'btn-yellow' : 'btn-blue';
    return `<div class="record-row" id="row-${r.id}">
      <div class="list-item" onclick="showDetail(${r.id})" style="cursor:pointer;">
        <div class="main-info">
          <div class="title">${esc(r.subject_name || '')} · ${r.mode === 'wrong' ? '❌错题重做' : r.mode === 'random' ? '🎲随机挑战' : '🎯自由组卷'}</div>
          <div class="sub">✅ ${r.correct} 对 · ❌ ${r.wrong} 错 · ⏰ ${fmtTime(r.finished_at)} · 用时 ${fmtDuration(r.duration_seconds)} · ⭐ 获得 ${r.points_earned || 0} 积分</div>
        </div>
        <div class="score-badge ${rank.cls}">${r.score}分</div>
        <button class="btn btn-sm ${btnCls}" onclick="event.stopPropagation();showDetail(${r.id})">${btnTxt}</button>
      </div>
      <div class="drawer" id="drawer-${r.id}" style="display:${isOpen ? 'block' : 'none'};"></div>
    </div>`;
  }).join('');
  // 如果当前有展开的记录，重新渲染后补载详情内容
  if (expandedRecordId) fillDrawer(expandedRecordId);
}

async function load() {
  try {
    allRecords = await API.get('/api/exam/records');
    await loadSubjects();
    renderList();
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function showDetail(recordId) {
  const rid = Number(recordId);
  // 如果点的是已展开的记录 → 收起
  if (expandedRecordId === rid) {
    expandedRecordId = null;
    renderList();
    return;
  }
  // 展开新记录（自动收起之前展开的）
  expandedRecordId = rid;
  renderList(); // 重新渲染列表（按钮文案+抽屉display 会更新）
}

async function fillDrawer(recordId) {
  const drawer = document.getElementById('drawer-' + recordId);
  if (!drawer) return;
  drawer.innerHTML = '<div style="color:#9c8bb5;text-align:center;padding:14px;">加载中…</div>';
  try {
    const r = await API.get(`/api/exam/records/${recordId}`);
    let html = `<div class="card" style="margin:8px 0 4px;">
      <div class="card-title">📋 ${esc(r.subject_name)} · ${r.score}分（对${r.correct} 错${r.wrong}） · ⭐ 获得 ${r.points_earned || 0} 积分</div>`;
    if (!r.answer_records || !r.answer_records.length) {
      html += '<div class="empty"><div class="icon">📭</div><p>本次没有作答明细</p></div>';
    } else {
      r.answer_records.forEach((ar, i) => {
        const q = ar.question || {};
        const [cls, label] = typeTag(q.type);
        const isRight = (ar.is_correct === true) || (ar.is_correct === null && ar.llm_score != null && ar.llm_score >= 60);
        const cardCls = isRight ? 'explain-card is-correct' : 'explain-card';
        const stTag = isRight
          ? '<span class="status status-right">✅ 答对</span>'
          : '<span class="status status-wrong">❌ 答错</span>';
        html += `
          <div class="${cardCls}">
            <div class="explain-head">
              <div class="q-num">${i + 1}</div>
              <span class="${cls}">${label}</span>
              ${q.topic_name ? `<span class="q-topic">${esc(q.topic_name)}</span>` : ''}
              ${stTag}
            </div>
            ${renderAnswerCard(q, ar)}
          </div>`;
      });
    }
    html += `<div style="text-align:center;margin-top:16px;"><button class="btn btn-sm btn-yellow" onclick="showDetail(${recordId})">收起</button></div></div>`;
    drawer.innerHTML = html;
  } catch (e) {
    drawer.innerHTML = `<div style="color:#e03131;padding:14px;">${esc(e.message)}</div>`;
  }
}

load();
</script>
</body>
</html>
