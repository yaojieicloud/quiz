<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>题库闯关 - 掌握度</title>
<link rel="stylesheet" href="css/common.css">
<style>
  .legend { display:flex; flex-wrap:wrap; gap:10px; margin:4px 0 18px; font-size:13px; }
  .legend span { display:inline-flex; align-items:center; gap:5px; }
  .dot { width:11px; height:11px; border-radius:50%; display:inline-block; }
  .subj-tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .subj-tabs .chip { cursor:pointer; padding:6px 14px; border-radius:14px; background:#f1edf7; color:#6b5b8a; font-weight:bold; }
  .subj-tabs .chip.active { background:#7b5cc4; color:#fff; }
  .subj-block { margin-bottom:22px; }
  .subj-title { font-size:18px; font-weight:bold; color:#4a3a6b; margin:10px 0 12px; }
  .unit-title { font-size:14px; color:#9a8bb0; margin:14px 0 8px; font-weight:bold; }
  .topic-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
  .topic-card { background:#fff; border-radius:14px; padding:13px 15px; box-shadow:0 2px 8px rgba(123,92,196,.08); border-left:5px solid #ddd; }
  .topic-card .tname { font-weight:bold; font-size:15px; color:#3a2f55; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .st-badge { font-size:12px; padding:2px 9px; border-radius:10px; font-weight:bold; white-space:nowrap; }
  .st-not_started { background:#f1f3f5; color:#868e96; }
  .st-practicing  { background:#e7f5ff; color:#1c7ed6; }
  .st-passed      { background:#d3f9d8; color:#2b8a3e; }
  .st-mastered    { background:#fff3bf; color:#e67700; }
  .st-review      { background:#ffe3e3; color:#e03131; }
  .bar-row { margin-top:9px; }
  .bar-label { font-size:12px; color:#868e96; display:flex; justify-content:space-between; margin-bottom:3px; }
  .bar { height:9px; background:#eef0f3; border-radius:6px; overflow:hidden; }
  .bar > i { display:block; height:100%; border-radius:6px; }
  .fi-rate > i { background:linear-gradient(90deg,#ff9a9e,#ff6b9d); }
  .fi-cov  > i { background:linear-gradient(90deg,#a18cd1,#7b5cc4); }
  .meta { font-size:11px; color:#adb5bd; margin-top:8px; }
  .deep-note { font-size:13px; color:#6b5b8a; background:#f1edf7; padding:8px 12px; border-radius:10px; margin:4px 0 14px; }
  .weak-flag { font-size:10px; padding:1px 6px; border-radius:8px; background:#ffe3e3; color:#e03131; margin-left:6px; font-weight:bold; white-space:nowrap; }
  .topic-card.in-weak { box-shadow:0 0 0 2px #ffc9c9, 0 2px 8px rgba(224,49,49,.12); }
  .topic-card.deep-highlight { animation:deepPulse 1.6s ease-out 2; }
  @keyframes deepPulse { 0%{box-shadow:0 0 0 0 rgba(123,92,196,.6);} 100%{box-shadow:0 0 0 10px rgba(123,92,196,0);} }
</style>
</head>
<body>
<div id="topbar"></div>
<header class="page-header">
  <div class="icon">🎯</div>
  <h1>掌握度</h1>
  <div class="subtitle">每节课达到「通过」标准，就算真正学会了！</div>
</header>
<main>
  <div id="childBox"></div>
  <div class="legend">
    <span><i class="dot" style="background:#2b8a3e"></i>通过（近期正确率≥90% 且覆盖到位）</span>
    <span><i class="dot" style="background:#e67700"></i>精通（≥95% 且覆盖≥80%）</span>
    <span><i class="dot" style="background:#1c7ed6"></i>练习中</span>
    <span><i class="dot" style="background:#e03131"></i>需复习（曾通过，近期下滑）</span>
    <span><i class="dot" style="background:#868e96"></i>未开始</span>
  </div>
  <div class="subj-tabs" id="subjTabs"></div>
  <div id="content"></div>
</main>
<script src="js/common.js"></script>
<script src="js/mastery.js"></script>
</body>
</html>
