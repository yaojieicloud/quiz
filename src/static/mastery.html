<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>题库闯关 - 掌握度</title>
<link rel="stylesheet" href="css/common.css">
<script src="vendor/echarts.min.js"></script>
<style>
  .section-box { background:#fff; border-radius:18px; padding:20px; box-shadow:0 4px 14px rgba(0,0,0,0.08); margin-bottom:16px; }
  .section-box h3 { font-size:18px; color:#3a3a55; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
  .filter-bar { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:16px; }
  .filter-bar .form-group { margin:0; flex:1; min-width:140px; }
  .filter-bar select { padding:10px 14px; }
  .chart-box { width:100%; height:320px; }
  .ana-table { width:100%; border-collapse:collapse; font-size:14px; }
  .ana-table th { background:#f4f0fa; color:#7a6c8c; padding:10px 12px; text-align:left; }
  .ana-table td { padding:10px 12px; border-top:1px solid #f1f3f5; vertical-align:top; }
  .st-badge { font-size:12px; padding:2px 9px; border-radius:10px; font-weight:bold; white-space:nowrap; }
  .st-not_started { background:#f1f3f5; color:#868e96; }
  .st-practicing  { background:#e7f5ff; color:#1c7ed6; }
  .st-passed      { background:#d3f9d8; color:#2b8a3e; }
  .st-mastered    { background:#fff3bf; color:#e67700; }
  .st-review      { background:#ffe3e3; color:#e03131; }
  .config-section { margin-bottom:4px; }
</style>
</head>
<body>

<div id="topbar"></div>

<header class="page-header">
  <div class="icon">🎯</div>
  <h1>掌握度</h1>
  <div class="subtitle">看看每门课学到什么程度了！</div>
</header>

<main>
  <div class="section-box" style="padding-bottom:8px;">
    <div class="filter-bar">
      <div class="form-group" style="flex:1;max-width:150px;">
        <label>难度档位</label>
        <select class="form-select" id="mvpTierSelect" onchange="loadMastery()">
          <option value="1">初级</option>
          <option value="2">进阶</option>
          <option value="3">挑战</option>
        </select>
      </div>
      <button class="btn btn-sm" onclick="loadMastery()">🔄 刷新</button>
    </div>
    <div class="config-section" style="margin-top:4px;">
      <div class="label" style="font-size:13px;color:#7a6c8c;margin-bottom:6px;">📚 科目（可多选，不选=全部）</div>
      <div class="chip-group" id="mvpSubjChips"></div>
    </div>
  </div>

  <div class="section-box">
    <h3>📊 各课精通度</h3>
    <div id="chartMasteryDist" class="chart-box"></div>
  </div>
  <div class="section-box">
    <h3>🎯 掌握度明细</h3>
    <div id="mvpMatrixBox"></div>
  </div>
</main>

<script src="js/common.js"></script>
<script src="js/analytics-shared.js"></script>
<script>
const user = requireAuth();
if (!user) throw new Error('redirect');
document.getElementById('topbar').innerHTML = renderTopbar('mastery');

let allSubjects = [];
let meData = null;

// 把 /api/mastery/me 的结构转成 shared 渲染需要的 {tier, topics, students}
function adaptMeData(data, tier, selectedSubjIds) {
  const myId = user.id;
  const students = [{ id: myId, name: user.nickname || user.username }];
  const topics = [];
  (data.subjects || []).forEach(sub => {
    if (selectedSubjIds.length && !selectedSubjIds.includes(sub.subject_id)) return;
    (sub.topics || []).forEach(t => {
      const tierInfo = t.tiers[tier] || {};
      topics.push({
        topic_id: t.topic_id,
        name: t.name,
        subject_name: sub.name,
        topic_total: tierInfo.topic_total || 0,
        cells: { [myId]: { [tier]: { status: tierInfo.status || 'not_started', coverage: tierInfo.coverage || 0 } } },
      });
    });
  });
  return { tier, topics, students };
}

async function loadMastery() {
  const tier = document.getElementById('mvpTierSelect').value || '1';
  const subjIds = getSubjectChipValues('mvpSubjChips');
  try {
    if (!meData) meData = await API.get('/api/mastery/me');
    const d = adaptMeData(meData, tier, subjIds);
    renderMasteryCoverageChart('chartMasteryDist', d);
    renderMasteryMatrix('mvpMatrixBox', d);
  } catch (e) { toast(e.message, 'error'); }
}

async function init() {
  try {
    const subs = await API.get('/api/subjects');
    allSubjects = subs;
    populateSubjectChips('mvpSubjChips', subs, ['Python基础实操'], 'loadMastery');
  } catch (e) { /* ignore */ }
  loadMastery();
}

init();
</script>
</body>
</html>
