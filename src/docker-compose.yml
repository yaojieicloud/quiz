services:
  quiz-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: quiz-system:local
    container_name: quiz-system
    restart: always
    ports:
      - "8000:8000"
    volumes:
      # 数据库文件映射到宿主机（项目根 data/），数据持久化
      - ${QUIZ_DATA_DIR:-../data}:/app/data
    environment:
      - QUIZ_DB_PATH=/app/data/quiz.db
      - QUIZ_SECRET_KEY=quiz-system-secret-key-change-in-production-2024
      - QUIZ_REGKEY=openschool2026
      - TZ=Asia/Shanghai
